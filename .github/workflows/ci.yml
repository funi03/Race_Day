name: RaceDay CI

on:
  push:
    branches: [ master, main, Part-3 ]
  pull_request:
    branches: [ master, main, Part-3 ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Build the API (Pointing to the root)
      - name: Restore API
        run: dotnet restore ./Race_Day.csproj

      - name: Build API
        run: dotnet build ./Race_Day.csproj --no-restore --configuration Release

      # Build the Web App (Pointing to the subfolder)
      - name: Restore Web
        run: dotnet restore ./RaceDay.Web/RaceDay.Web.csproj

      - name: Build Web
        run: dotnet build ./RaceDay.Web/RaceDay.Web.csproj --no-restore --configuration Release
