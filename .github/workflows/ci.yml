name: RaceDay CI

on:
  push:
    branches: [ master, main, part-2-api ]
  pull_request:
    branches: [ master, main, part-2-api ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Find solution file
        id: find-sln
        run: |
          SLN=$(find . -name "*.sln" -not -path "*/bin/*" -not -path "*/obj/*" | head -n 1)
          echo "Found solution: $SLN"
          echo "sln_path=$SLN" >> $GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore "${{ steps.find-sln.outputs.sln_path }}"

      - name: Build
        run: dotnet build "${{ steps.find-sln.outputs.sln_path }}" --no-restore --configuration Release
